<header class="navbar" [class.navbar-scrolled]="isScrolled">
  <div class="navbar-inner">
    <!-- LOGO -->
    <a href="/" class="logo" (click)="closeMenu()">
      <img src="assets/images/logo.png" alt="Cycle Service" />
    </a>

    <!-- DESKTOP NAV -->
    <nav class="desktop-nav">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <!-- <a href="#gallery">Gallery</a> -->
      <a href="#contact">Contact</a>

      <a href="/appointment" class="nav-book"> Book Service </a>
    </nav>

    <!-- MOBILE BUTTON -->
    <p-button
      class="mobile-menu-button"
      icon="pi pi-bars"
      [text]="true"
      (onClick)="toggleMobileMenu()"
      ariaLabel="Open navigation"
    />
    <!-- MOBILE MENU BUTTON -->
    <!-- <button
      class="mobile-menu-button"
      type="button"
      (click)="toggleMobileMenu()"
      aria-label="Open navigation"
    >
      <i class="pi" [class.pi-times]="mobileMenuVisible" [class.pi-bars]="!mobileMenuVisible"></i>
    </button> -->
  </div>
</header>

<!-- MOBILE DRAWER -->
<p-drawer [(visible)]="mobileMenuVisible" position="right" [closable]="false">
  <div class="mobile-nav">
    <a href="#home" (click)="closeMenu()">Home</a>
    <a href="#about" (click)="closeMenu()">About</a>
    <a href="#services" (click)="closeMenu()">Services</a>
    <!-- <a href="#gallery" (click)="closeMenu()">Gallery</a> -->
    <a href="#contact" (click)="closeMenu()">Contact</a>

    <a href="/appointment" class="mobile-book" (click)="closeMenu()"> Book Service </a>
  </div>
</p-drawer>
