<header class="navbar" [class.navbar-scrolled]="isScrolled" role="banner">
  <div class="navbar-inner">
    <!-- LOGO -->
    <a href="/" class="logo" (click)="closeMenu()" aria-label="Cycle Service Center Home">
      <img src="assets/images/logo.png" alt="Cycle Service Logo" />
    </a>

    <!-- DESKTOP NAV -->
    <nav class="desktop-nav" aria-label="Main Navigation">
      <a href="#home" class="nav-link">Home</a>
      <a href="#about" class="nav-link">About</a>
      <a href="#services" class="nav-link">Services</a>
      <a href="#how-it-works" class="nav-link">How It Works</a>
      <a href="#gallery" class="nav-link">Gallery</a>
      <a href="#contact" class="nav-link">Contact</a>

      <a routerLink="/appointment" class="nav-book-btn">
        <span>Book Service</span>
        <i class="pi pi-arrow-right"></i>
      </a>
    </nav>

    <!-- MOBILE / TABLET MENU TOGGLE -->
    <p-button
      class="mobile-menu-button"
      [icon]="mobileMenuVisible ? 'pi pi-times' : 'pi pi-bars'"
      [text]="true"
      (onClick)="toggleMobileMenu()"
      ariaLabel="Toggle mobile menu"
    />
  </div>
</header>

<!-- MOBILE DRAWER -->
<p-drawer [(visible)]="mobileMenuVisible" position="right" [closable]="true" styleClass="custom-mobile-drawer">
  <ng-template #header>
    <div class="drawer-header-brand">
      <img src="assets/images/logo.png" alt="Cycle Service" class="drawer-logo" />
    </div>
  </ng-template>

  <div class="mobile-nav">
    <a href="#home" (click)="closeMenu()" class="mobile-link">
      <i class="pi pi-home"></i>
      <span>Home</span>
    </a>
    <a href="#about" (click)="closeMenu()" class="mobile-link">
      <i class="pi pi-info-circle"></i>
      <span>About</span>
    </a>
    <a href="#services" (click)="closeMenu()" class="mobile-link">
      <i class="pi pi-wrench"></i>
      <span>Services</span>
    </a>
    <a href="#how-it-works" (click)="closeMenu()" class="mobile-link">
      <i class="pi pi-list-check"></i>
      <span>How It Works</span>
    </a>
    <a href="#gallery" (click)="closeMenu()" class="mobile-link">
      <i class="pi pi-images"></i>
      <span>Gallery</span>
    </a>
    <a href="#contact" (click)="closeMenu()" class="mobile-link">
      <i class="pi pi-phone"></i>
      <span>Contact</span>
    </a>

    <div class="mobile-drawer-cta">
      <a routerLink="/appointment" class="btn-primary mobile-book-btn" (click)="closeMenu()">
        <span>Book Service Now</span>
        <i class="pi pi-arrow-right"></i>
      </a>
    </div>
  </div>
</p-drawer>
