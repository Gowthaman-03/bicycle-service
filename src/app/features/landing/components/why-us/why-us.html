<section class="section trust-section" aria-labelledby="trust-heading">
  <div class="container">
    <div class="trust-header text-center">
      <p class="section-eyebrow">OUR COMMITMENT</p>
      <h2 id="trust-heading" class="section-title">
        Why Cyclists <span>Trust Us</span>
      </h2>
      <p class="section-subtitle mx-auto">
        Built on mechanical integrity, genuine components, and honest communication at every step of your bicycle service.
      </p>
    </div>

    <div class="benefits-grid">
      @for (item of benefits; track item.number) {
        <article class="benefit-card">
          <div class="card-header-flex">
            <span class="benefit-number">{{ item.number }}</span>
            <div class="benefit-icon">
              <i [class]="item.icon"></i>
            </div>
          </div>

          <h3 class="benefit-title">{{ item.title }}</h3>
          <p class="benefit-description">{{ item.description }}</p>

          <div class="card-edge-glow"></div>
        </article>
      }
    </div>
  </div>
</section>
