<section id="gallery" class="section gallery-section" aria-labelledby="gallery-heading">
  <div class="container">
    <div class="gallery-header" appScrollReveal="fade-up">
      <div>
        <p class="section-eyebrow">THE WORKSHOP</p>
        <h2 id="gallery-heading" class="section-title">
          Craft In <span class="text-orange">Motion</span>
        </h2>
      </div>
      <p class="section-subtitle">
        A glimpse inside our specialized workshop, diagnostic equipment, and completed builds.
      </p>
    </div>

    <div class="gallery-grid">
      @for (item of items; track item.title; let idx = $index) {
        <div class="gallery-card" appScrollReveal="scale" [delay]="idx * 100">
          <div class="gallery-image-wrap">
            <img [src]="item.image" [alt]="item.alt" loading="lazy" class="gallery-img" />
            <div class="gallery-overlay">
              <div class="gallery-tag">{{ item.tag }}</div>
              <h3 class="gallery-card-title">{{ item.title }}</h3>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
