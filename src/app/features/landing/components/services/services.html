<section id="services" class="section services-section" aria-labelledby="services-heading">
  <div class="container">
    <div class="services-layout">
      <!-- Left Column: Header & CTA -->
      <div class="services-sidebar" appScrollReveal="fade-right">
        <p class="section-eyebrow">WHAT WE DO</p>
        <h2 id="services-heading" class="section-title">
          OUR <span class="text-orange">SERVICES</span>
        </h2>
        <p class="section-subtitle">
          From basic tune-ups to complex repairs, we provide complete bicycle care under one roof.
        </p>

        <div class="services-action-wrap">
          <a routerLink="/service" class="btn-secondary services-view-btn">
            <span>VIEW ALL SERVICES</span>
            <i class="pi pi-arrow-right"></i>
          </a>
        </div>
      </div>

      <!-- Right Column: 4 Service Cards Grid -->
      <div class="services-cards-grid">
        @for (card of serviceCards; track card.id; let idx = $index) {
          <a
            [routerLink]="card.link"
            class="service-feature-card blueprint-card"
            appScrollReveal="fade-up"
            [delay]="idx * 120"
          >
            <div class="card-icon-circle">
              <i [class]="card.icon"></i>
            </div>
            <h3 class="card-title">{{ card.title }}</h3>
            <p class="card-desc">{{ card.description }}</p>
            <div class="card-corner-glow"></div>
          </a>
        }
      </div>
    </div>
  </div>
</section>
